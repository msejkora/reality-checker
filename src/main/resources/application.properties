# Spring configuration
using.spring.schedulerFactory=true
spring.jpa.hibernate.ddl-auto=none
spring.quartz.job-store-type=memory
spring.flyway.enabled=true
server.port=8061

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/realitychecker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:realitychecker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:realitychecker}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.cz.mata=INFO
logging.level.org.flywaydb=INFO

# Main configuration
main.repeat.interval=${MAIN_REPEAT_INTERVAL:600000}

#
limit.price=${LIMIT_PRICE:13000000}

# Application configuration
app.filter-directory=${APP_FILTER_DIRECTORY:src/main/resources/filters}

# Email
spring.mail.host=${SPRING_MAIL_HOST:smtp.seznam.cz}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:sejk.m@seznam.cz}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:true}
email.addresses=${EMAIL_ADDRESSES:}
